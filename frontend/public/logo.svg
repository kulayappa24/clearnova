<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062319" />
      <stop offset="100%" stop-color="#0e4d37" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGrad)" stroke="#1ab882" stroke-width="4" stroke-opacity="0.3" />

  <path d="M 100,30 C 145,30 170,65 170,110 C 170,155 130,170 100,170 C 70,170 30,155 30,110 C 30,65 55,30 100,30 Z" fill="url(#leafGrad)" filter="url(#glow)" opacity="0.95" />

  <path d="M 100,45 C 130,70 145,100 140,140 C 120,110 90,85 100,45 Z" fill="#6ee7b7" opacity="0.4" />

  <g transform="translate(100, 100)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z" fill="#ffffff" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="5" fill="#047857" />
  </g>

  <circle cx="100" cy="100" r="72" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="8 12" opacity="0.6" />
</svg>
